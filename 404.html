<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Страница не найдена | Азбука Ремонта</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --red:#E8201A; --red-dark:#C41A15; --bg:#161310; --white:#fff;
          --gray:#888; --gray-light:#CCC; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:24px; background:var(--bg); color:var(--gray-light);
         font-family:'Inter',sans-serif; text-align:center; }
  .box { max-width:520px; }
  .code { font-family:'Oswald',sans-serif; font-weight:700; font-size:clamp(88px,18vw,150px);
          line-height:1; color:var(--red); letter-spacing:.02em; }
  h1 { margin:8px 0 16px; font-family:'Oswald',sans-serif; font-weight:600;
       font-size:clamp(22px,4vw,30px); line-height:1.2; text-transform:uppercase; color:var(--white); }
  p { margin:0; font-size:16px; line-height:1.6; }
  .note { margin-top:12px; color:var(--gray); font-size:14px; }
  a.btn { display:inline-block; margin-top:28px; padding:14px 32px; border-radius:999px;
          background:var(--red); color:#fff; text-decoration:none; font-weight:500;
          transition:background .2s; }
  a.btn:hover { background:var(--red-dark); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Адрес набран с ошибкой или такой страницы в предварительной версии нет.</p>
    <p class="note">Это превью сайта «Азбука Ремонта», собранное для согласования.</p>
    <a class="btn" href="./">Вернуться на главную</a>
  </div>
</body>
</html>
